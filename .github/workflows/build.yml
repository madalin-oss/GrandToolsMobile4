name: Build Grand Tools APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
